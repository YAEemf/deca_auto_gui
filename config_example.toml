[frequency]
# 周波数グリッド設定
f_start = 1e2   # 開始周波数 [Hz]
f_stop = 1e9    # 終了周波数 [Hz]
num_points_per_decade = 128 # Decade毎の計算ポイント数

# 評価帯域
f_L = 1e3   # 下限周波数 [Hz]
f_H = 1e8   # 上限周波数 [Hz]

[target]
# 目標インピーダンスモード
# "flat": 単一値のフラット目標
# "auto": 電源仕様から自動計算
# "custom": カスタムマスク（対数補間）
target_impedance_mode = "custom"

# フラット目標インピーダンス [Ω]
z_target = 10e-3

# カスタムマスク（任意）[(freq, impedance), ...]
# もしマスクの方が評価帯域より広ければマスクの帯域が優先される
z_custom_mask = [
    [1e3, 8e-3],
    [1e6, 8e-3],
    [1e7, 2e-2],
    [1e8, 0.20],
]

# 自動計算モード用パラメーター
v_supply = 3.3              # 電源電圧 [V]
ripple_ratio = 5.0          # 許容リップル率 [%]（ripple_voltageと排他）
# ripple_voltage = 50e-3    # 許容リップル電圧 [V]（ripple_ratioと排他）
i_max = 5.0                # 最大消費電流 [A]
switching_activity = 0.5    # 電流変動率 (0-1)（i_transientと排他）
# i_transient = 5.0         # 過渡電流 [A]（switching_activityと排他）
design_margin = 15.0        # デザインマージン [%]

[pdn_parasitic]
# PDN寄生成分
R_vrm = 15e-3   # VRM ESR [Ω]
L_vrm = 5e-9   # VRM ESL [H]
R_sN = 0.5e-3   # spreading抵抗（デカップリングコンデンサ用）[Ω]
L_sN = 4e-10    # spreadingインダクタンス（デカップリングコンデンサ用）[H]
L_mntN = 0.2e-10  # マウントインダクタンス [H]
R_s = 0.2e-3    # spreading抵抗（VCC直前）[Ω]
L_s = 0.25e-9   # spreadingインダクタンス（VCC直前）[H]
R_v = 1e-3    # via抵抗 [Ω]
L_v = 5e-10     # viaインダクタンス [H]
R_p = 20e-3     # プレーナ抵抗 [Ω]
C_p = 2.5e-11   # プレーナ容量 [F]
tan_delta_p = 0.02  # 基板の誘電正接

[spice]
# SPICEシミュレーション
dc_bias = 3.3       # DCバイアス電圧 [V]
model_path = "model"    # SPICEモデルディレクトリ

[search]
# 探索設定
max_total_parts = 10    # コンデンサ総数上限
min_total_parts_ratio = 0.6     # 最小総数比率（これより少ない総数の組み合わせは探索から除外）
top_k = 15  # 保持する上位候補数
shuffle_evaluation = true   # 評価順のシャッフル（探索途中から全体に散らばった多様な候補が現れる）

[weights]
# スコア重み（全項目は同程度のスケールに正規化済み。ある重みを大きくすると、その特性に優れた候補が現れやすくなる）
weight_max = 1.0        # ピーク：評価帯域内の目標比の最大値（目標の1/2以下で0、目標ちょうどで1）
weight_area = 1.0       # 超過量：目標を超えた量の帯域平均
weight_mean = 0.3       # 平均：目標比の帯域平均（目標の1/2以下は飽和）
weight_anti = 0.5       # 反共振：ピークの突出量（プロミネンス）の合計
weight_resonance = 0.1  # 共振の谷：急峻な谷の深さの合計
weight_flat = 0.1       # 平坦さ：目標比の加重標準偏差
weight_parts = 0.1      # 部品点数：総数 / 10
weight_num_types = 0.25 # 種類数：種類数 / 5
weight_mc_worst = 1.0   # Monte Carlo最悪時のインピーダンス評価の悪化量
ignore_safe_anti_resonance = true   # 目標以下の反共振/谷を無視

[monte_carlo]
# Monte Carlo設定
mc_enable = true
mc_samples = 64
tol_C = 0.15    # 容量公差
tol_ESR = 0.15  # ESR公差
tol_ESL = 0.15  # ESL公差
mlcc_derating = 0.15    # MLCCディレーティング（derating を個別指定していないコンデンサに適用）

[system]
# システム設定
seed = 1234     # 乱数シード（シャッフルやMonte Carlo評価で使用）
max_vram_ratio_limit = 0.5  # GPU VRAM使用率上限
cuda = 0
dtype_c = "complex64"   # 複素数精度
dtype_r = "float32"     # 実数精度
force_numpy = false     # NumPy強制使用（GPUが無い環境用）

[gui]
# GUI設定
use_gui = true
server_port = 8501
dark_theme = true
language = "jp"

[output]
excel_path = "out"
excel_name = "dcap_result"

# コンデンサリスト
# SPICEモデルがある場合はpathを指定、ない場合はRLC値を直接指定
[[capacitors]]
name = "C_0603_0.1u"
C = 0.1e-6
ESR = 15e-3
ESL = 2e-10
L_mnt = 0.2e-10
# derating = 0.3  # 任意: Monte Carloの容量ディレーティング（未指定は mlcc_derating。ポリマー/電解は 0）

# SPICEモデルを使用する場合の例
# [[capacitors]]
# name = "SPICE_DEMO104"
# path = "MLCCSPICEDEMO.mod"  # model/MLCCSPICEDEMO.mod
# L_mnt = 0.5e-9