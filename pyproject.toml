[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deca_auto"
version = "1.0.0"
description = "PDN Impedance Optimization Tool with Decoupling Capacitor Auto-selection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "YAE", email = "yae@example.com"}
]
dependencies = [
    "numpy>=2.0,<2.3",
    "pandas>=3.0.3",
    "cupy-cuda12x>=14.1.1",
    "pyspice>=1.5",
    "scikit-rf>=1.12.0",
    "scipy>=1.17.1",
    "streamlit>=1.58.0",
    "altair>=6.2.1",
    "xlsxwriter>=3.2.9",
    "tqdm>=4.68.1",
    "tomlkit>=0.12.0,<0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "ruff>=0.15.16"
]

[project.scripts]
deca-auto = "deca_auto.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deca_auto = ["*.toml"]
