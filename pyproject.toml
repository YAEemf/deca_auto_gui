[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deca_auto"
version = "1.0.0"
description = "PDN Impedance Optimization Tool with Decoupling Capacitor Auto-selection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "YAE", email = "yae@example.com"}
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    # [ctk]によりCUDAランタイムもpipで導入されるため、CUDA Toolkitのインストールは不要
    "cupy-cuda13x[ctk]>=14.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "pyspice>=1.5",
    "scikit-rf>=1.8",
    "scipy>=1.14.1",
    "streamlit>=1.50",
    "altair>=5.5",
    "xlsxwriter>=3.2",
    "tqdm>=4.66",
    "tomlkit>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "mypy>=1.11",
    "ruff>=0.6"
]

[project.scripts]
deca-auto = "deca_auto.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deca_auto = ["*.toml"]
